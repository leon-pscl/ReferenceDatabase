<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { font-family: 'Google Sans', Roboto, Arial, sans-serif; font-size: 13px; color: #202124; height: 100%; overflow: hidden; }
    #toolbar { position: fixed; top: 0; left: 0; right: 0; height: 44px; padding: 10px 12px 8px; border-bottom: 1px solid #dadce0; z-index: 1; background: white; }
    #toolbar select { width: 100%; padding: 6px 8px; border: 1px solid #dadce0; border-radius: 4px; font-size: 13px; }
    #collections { position: fixed; top: 44px; left: 0; bottom: 24px; width: 220px; border-right: 1px solid #dadce0; overflow-y: scroll; padding: 6px 0; background: #f8f9fa; -webkit-overflow-scrolling: touch; }
    #items { position: fixed; top: 44px; left: 220px; right: 0; bottom: 24px; overflow-y: scroll; padding: 10px 14px; -webkit-overflow-scrolling: touch; }
    #status { position: fixed; bottom: 0; left: 0; right: 0; height: 24px; padding: 4px 12px; font-size: 11px; color: #5f6368; border-top: 1px solid #dadce0; background: white; z-index: 1; overflow: hidden; }
    #status.error { color: #c5221f; }
    .folder { padding: 5px 10px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; display: flex; align-items: center; gap: 5px; }
    .folder:hover { background: #e8eaed; }
    .folder.active { background: #d2e3fc; font-weight: 500; }
    .folder .icon { flex-shrink: 0; opacity: 0.6; font-size: 14px; }
    .item { border: 1px solid #e0e0e0; border-radius: 6px; padding: 10px; margin-bottom: 6px; display: flex; flex-direction: column; gap: 3px; }
    .item .title { font-weight: 500; line-height: 1.3; }
    .item .meta { font-size: 11px; color: #5f6368; }
    .item button { align-self: flex-start; margin-top: 6px; padding: 4px 12px; font-size: 12px; border: 1px solid #1a73e8; color: #1a73e8; background: white; border-radius: 4px; cursor: pointer; }
    .item button:hover { background: #e8f0fe; }
    .item button:disabled { opacity: 0.6; cursor: default; }
    .item.imported { border-color: #188038; background: #e6f4ea; }
    .empty { color: #5f6368; font-size: 12px; margin-top: 20px; text-align: center; }
    #item-count { font-size: 11px; color: #5f6368; margin-bottom: 6px; }
  </style>
</head>
<body>
  <div id="toolbar">
    <select id="library"></select>
  </div>
  <div id="collections"></div>
  <div id="items"><div class="empty">Select a collection to browse.</div></div>
  <div id="status"></div>

  <script>
    var librarySelect = document.getElementById('library');
    var collectionsEl = document.getElementById('collections');
    var itemsEl = document.getElementById('items');
    var statusEl = document.getElementById('status');
    var currentLib = null;

    function setStatus(msg, kind) {
      statusEl.textContent = msg || '';
      statusEl.className = kind || '';
    }

    function escapeHtml(s) {
      var d = document.createElement('div');
      d.appendChild(document.createTextNode(s));
      return d.innerHTML;
    }

    google.script.run
      .withSuccessHandler(function (options) {
        if (!options || options.length === 0) {
          setStatus('No Zotero libraries available -- check your Script Properties.', 'error');
          return;
        }
        options.forEach(function (opt) {
          var el = document.createElement('option');
          el.value = JSON.stringify({ libraryType: opt.libraryType, libraryId: opt.libraryId });
          el.textContent = opt.label;
          librarySelect.appendChild(el);
        });
        loadCollections();
      })
      .withFailureHandler(function (err) {
        setStatus(err.message || 'Could not load libraries.', 'error');
      })
      .getZoteroLibraryOptions();

    librarySelect.addEventListener('change', function () { loadCollections(); });

    function loadCollections() {
      currentLib = JSON.parse(librarySelect.value);
      collectionsEl.innerHTML = '';
      itemsEl.innerHTML = '<div class="empty">Loading collections...</div>';
      setStatus('Loading collections...');

      google.script.run
        .withSuccessHandler(function (cols) {
          setStatus('');
          if (!cols || cols.length === 0) {
            itemsEl.innerHTML = '<div class="empty">No collections found.</div>';
            return;
          }
          renderTree(cols);
        })
        .withFailureHandler(function (err) {
          setStatus(err.message || 'Failed to load collections.', 'error');
        })
        .getZoteroCollections(currentLib.libraryType, currentLib.libraryId);
    }

    function renderTree(cols) {
      var byParent = {};
      cols.forEach(function (c) {
        var pid = c.parentCollection || '__root__';
        if (!byParent[pid]) byParent[pid] = [];
        byParent[pid].push(c);
      });

      collectionsEl.innerHTML = '';

      var allEl = document.createElement('div');
      allEl.className = 'folder';
      allEl.innerHTML = '<span class="icon">&#128196;</span> All Items';
      allEl.addEventListener('click', function () {
        document.querySelectorAll('.folder').forEach(function (f) { f.classList.remove('active'); });
        allEl.classList.add('active');
        loadAllItems();
      });
      collectionsEl.appendChild(allEl);

      function renderLevel(parentId, depth) {
        var children = byParent[parentId] || [];
        children.sort(function (a, b) { return a.name.localeCompare(b.name); });
        children.forEach(function (c) {
          var el = document.createElement('div');
          el.className = 'folder';
          el.style.paddingLeft = (10 + depth * 18) + 'px';
          var hasSub = byParent[c.key] && byParent[c.key].length > 0;
          el.innerHTML = '<span class="icon">' + (hasSub ? '&#128193;' : '&#128194;') + '</span> ' + escapeHtml(c.name);
          el.addEventListener('click', function () {
            document.querySelectorAll('.folder').forEach(function (f) { f.classList.remove('active'); });
            el.classList.add('active');
            loadCollectionItems(c.key, c.name);
          });
          collectionsEl.appendChild(el);
          renderLevel(c.key, depth + 1);
        });
      }

      renderLevel('__root__', 0);
    }

    function loadAllItems() {
      itemsEl.innerHTML = '<div class="empty">Loading items...</div>';
      setStatus('Loading items...');

      google.script.run
        .withSuccessHandler(function (items) {
          setStatus('');
          renderItems(items);
        })
        .withFailureHandler(function (err) {
          setStatus(err.message || 'Failed to load items.', 'error');
        })
        .getZoteroCollectionItems(currentLib.libraryType, currentLib.libraryId, '__all__');
    }

    function loadCollectionItems(collectionKey, name) {
      itemsEl.innerHTML = '<div class="empty">Loading ' + escapeHtml(name) + '...</div>';
      setStatus('Loading items...');

      google.script.run
        .withSuccessHandler(function (items) {
          setStatus('');
          renderItems(items);
        })
        .withFailureHandler(function (err) {
          setStatus(err.message || 'Failed to load items.', 'error');
        })
        .getZoteroCollectionItems(currentLib.libraryType, currentLib.libraryId, collectionKey);
    }

    function renderItems(items) {
      itemsEl.innerHTML = '';
      if (!items || items.length === 0) {
        itemsEl.innerHTML = '<div class="empty">No items in this collection.</div>';
        return;
      }
      var countEl = document.createElement('div');
      countEl.id = 'item-count';
      countEl.textContent = items.length + ' item' + (items.length !== 1 ? 's' : '');
      itemsEl.appendChild(countEl);

      items.forEach(function (item) {
        var card = document.createElement('div');
        card.className = 'item';

        var title = document.createElement('div');
        title.className = 'title';
        title.textContent = item.title;
        card.appendChild(title);

        var meta = document.createElement('div');
        meta.className = 'meta';
        var parts = [];
        if (item.authors) parts.push(item.authors);
        if (item.year) parts.push(item.year);
        if (item.itemType) parts.push(item.itemType);
        meta.textContent = parts.join(' · ');
        card.appendChild(meta);

        var btn = document.createElement('button');
        btn.textContent = 'Import';
        btn.addEventListener('click', function () {
          btn.disabled = true;
          btn.textContent = 'Importing...';
          google.script.run
            .withSuccessHandler(function (result) {
              btn.textContent = result.status === 'duplicate' ? 'Already added' : 'Added';
              card.classList.add('imported');
            })
            .withFailureHandler(function (err) {
              btn.disabled = false;
              btn.textContent = 'Import';
              setStatus(err.message || 'Import failed.', 'error');
            })
            .importZoteroItem(currentLib.libraryType, currentLib.libraryId, item.key);
        });
        card.appendChild(btn);
        itemsEl.appendChild(card);
      });
    }
  </script>
</body>
</html>
